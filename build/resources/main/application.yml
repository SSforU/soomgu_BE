  #  CREATE DATABASE soomgu;
   # CREATE USER soomgu WITH ENCRYPTED PASSWORD 'change_me';
    #GRANT ALL PRIVILEGES ON DATABASE soomgu TO soomgu;

server:
  port: 8080

# 멤버 고정값(서비스에서 @Value로 주입)
soomgu:
  user:
    id: 1
    username: ssulion
    email: ssulion@example.com

logging:
  level:
    root: INFO
    org.springframework.web: INFO
