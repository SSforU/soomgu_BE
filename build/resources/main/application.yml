spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/soomgu
    username: soomgu
    password: change_me
    jpa:
      hibernate:
        ddl-auto: none         # 지금은 엔티티 없으니 스키마 생성 필요 없음
      properties:
        hibernate:
          format_sql: true
  application:
    name: soomgu
  profiles:
    active: dev   # 기본 실행 프로파일
